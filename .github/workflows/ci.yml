name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # the build only needs a syntactically valid url; no backend is contacted at build time
      - run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud

  n8n-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # generated secrets, n8n + import job + mailpit only (no convex); the script prints n8n logs on failure and tears down
      - run: scripts/n8n-smoke.sh
